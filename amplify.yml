# Amplify WEB_COMPUTE (SSR) deploy for annotation_ui.
#
# The app reads its corpus and pipeline artifacts from S3 and writes one JSON object
# per judgement, so nothing depends on the repo working tree at runtime. Required
# environment, set in the Amplify console:
#
#   S3_BUCKET_NAME   the bucket holding stg_01_ocr/ and results/concept_similarity/
#   AWS_REGION       defaults to us-east-1
#   S3_PREFIX        optional key prefix, if the corpus is not at the bucket root
#
# The SSR compute role needs, on that bucket:
#   s3:GetObject   on stg_01_ocr/* and results/concept_similarity/*
#   s3:PutObject   on chunk_annotations/*
#   s3:ListBucket  scoped to prefix chunk_annotations/*   (progress readback)
#
# Populate the bucket first with `npm run upload-corpus` (see annotation_ui/README.md).
# Unset S3_BUCKET_NAME to fall back to local disk, which is how `npm run dev` works.
version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
        postBuild:
          commands:
            # Build .amplify-hosting package for Amplify WEB_COMPUTE (SSR)
            - mkdir -p .amplify-hosting/compute/default .amplify-hosting/static/_next
            # Standalone server + its bundled node_modules
            - cp -r .next/standalone/. .amplify-hosting/compute/default/
            # Static assets alongside the server (needed for SSR fallback)
            - cp -r .next/static .amplify-hosting/compute/default/.next/static
            # Static assets served directly from CloudFront
            - cp -r .next/static .amplify-hosting/static/_next/static
            # public/ folder (favicons, etc.) if it exists
            - '[ -d public ] && cp -r public/. .amplify-hosting/compute/default/public/ || true'
            # Node entrypoint wrapper: force host/port and bake in S3_BUCKET_NAME
            # from the build environment (Amplify does not forward console env vars
            # to the SSR compute runtime for manual standalone builds). Entrypoint
            # must be runnable with `node <entrypoint>`.
            - >-
              node -e "const b=process.env.S3_BUCKET_NAME||'';
              const r=process.env.AWS_REGION||'us-east-1';
              const p=process.env.S3_PREFIX||'';
              require('fs').writeFileSync(
                '.amplify-hosting/compute/default/index.js',
                \"process.env.S3_BUCKET_NAME=process.env.S3_BUCKET_NAME||'\"+b+\"';\n\"+
                \"process.env.AWS_REGION=process.env.AWS_REGION||'\"+r+\"';\n\"+
                \"process.env.S3_PREFIX=process.env.S3_PREFIX||'\"+p+\"';\n\"+
                \"process.env.HOSTNAME='0.0.0.0';\n\"+
                \"process.env.PORT=process.env.PORT||'3000';\n\"+
                \"require('./server.js');\n\"
              );"
            # Deploy manifest — framework is REQUIRED; entrypoint must be node-runnable.
            - >-
              node -e "require('fs').writeFileSync(
                '.amplify-hosting/deploy-manifest.json',
                JSON.stringify({
                  version: 1,
                  routes: [
                    { path: '/_next/static/*', target: { kind: 'Static', cacheControl: 'public, max-age=31536000, immutable' } },
                    { path: '/*.*', target: { kind: 'Static' }, fallback: { kind: 'Compute', src: 'default' } },
                    { path: '/*', target: { kind: 'Compute', src: 'default' } }
                  ],
                  computeResources: [{ name: 'default', runtime: 'nodejs20.x', entrypoint: 'index.js' }],
                  framework: { name: 'next', version: '14.2.35' }
                }, null, 2)
              );"
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    appRoot: annotation_ui
