version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
        postBuild:
          commands:
            # Build .amplify-hosting package for Amplify WEB_COMPUTE (SSR)
            - mkdir -p .amplify-hosting/compute/default .amplify-hosting/static/_next
            # Standalone server + its bundled node_modules
            - cp -r .next/standalone/. .amplify-hosting/compute/default/
            # Static assets alongside the server (needed for SSR fallback)
            - cp -r .next/static .amplify-hosting/compute/default/.next/static
            # Static assets served directly from CloudFront
            - cp -r .next/static .amplify-hosting/static/_next/static
            # public/ folder (favicons, etc.) if it exists
            - '[ -d public ] && cp -r public/. .amplify-hosting/compute/default/public/ || true'
            # Node entrypoint wrapper: force host/port, then start the standalone server.
            # Amplify requires the entrypoint to be runnable with `node <entrypoint>`.
            - printf "process.env.HOSTNAME='0.0.0.0';\nprocess.env.PORT=process.env.PORT||'3000';\nrequire('./server.js');\n" > .amplify-hosting/compute/default/index.js
            # Deploy manifest — framework is REQUIRED; entrypoint must be node-runnable.
            - >-
              node -e "require('fs').writeFileSync(
                '.amplify-hosting/deploy-manifest.json',
                JSON.stringify({
                  version: 1,
                  routes: [
                    { path: '/_next/static/*', target: { kind: 'Static', cacheControl: 'public, max-age=31536000, immutable' } },
                    { path: '/*.*', target: { kind: 'Static' }, fallback: { kind: 'Compute', src: 'default' } },
                    { path: '/*', target: { kind: 'Compute', src: 'default' } }
                  ],
                  computeResources: [{ name: 'default', runtime: 'nodejs20.x', entrypoint: 'index.js' }],
                  framework: { name: 'next', version: '14.2.35' }
                }, null, 2)
              );"
      artifacts:
        baseDirectory: .amplify-hosting
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    appRoot: annotation_ui
